name: SpeakWise AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Client Dependencies & Verify Build
        run: |
          cd client
          npm ci
          npm run build

      - name: Install Server Dependencies & Verify Build
        run: |
          cd server
          npm ci
          npm run build

      - name: Build Docker Container Images
        run: |
          docker build -t speakwise-client:latest ./client
          docker build -t speakwise-server:latest ./server
