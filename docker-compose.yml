version: '3.8'

services:
  # MongoDB Primary Database
  mongodb:
    image: mongo:7.0
    container_name: speakwise_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: speakwise_db
    volumes:
      - mongo_data:/data/db

  # Redis Sentinel / Cache & Queue Store
  redis:
    image: redis:7.2-alpine
    container_name: speakwise_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
